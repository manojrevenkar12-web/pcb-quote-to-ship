name: overlapping oven outages across holiday rebound
description: >
  During a quiet holiday week oven-1 is taken down for planned maintenance, oven-2 then fails while
  it is still down, leaving no reflow for several hours, and demand rebounds sharply right after the
  holiday while inspection machine aoi-2 is out, testing recovery from a backlog at two stations at once.
