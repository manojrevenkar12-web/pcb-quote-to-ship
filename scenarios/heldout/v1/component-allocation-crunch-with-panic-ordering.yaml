name: component allocation crunch with panic ordering
description: >
  A distributor allocation crisis makes parts far less likely to be in stock for three weeks, and
  worried customers rush in extra quote requests at the start of it, so the factory must keep quoting
  realistic ship dates while many accepted orders sit waiting for long-lead parts.
