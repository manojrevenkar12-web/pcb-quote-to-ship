# Business settings the decision models use. Everything here is something the company would
# know or decide; nothing here is the simulated world's truth.

factory:                           # what the company owns and how it staffs it (not how fast it runs)
  day_minutes: 1440
  shipping_cutoff_minute: 1320
  movers: 34
  machines: {kitting: 2, printer: 2, placer: 4, oven: 2, aoi: 2}
  placers: [placer-1, placer-2, placer-3, placer-4]
  oven_concurrency: 6
  operators: 4
  shift_start_minute: 360
  shift_end_minute: 1320
  attrition: 0.03

costs:
  labour_per_minute: 0.75          # manual cell, fully loaded
  machine_per_minute: 0.35         # Grid variable cost (power, nozzles, paste, mover wear)
  holding_rate_per_year: 0.25
  working_days_per_year: 250
  late_credit_per_day: 0.05        # credit to the customer per late working day, share of price
  late_credit_cap: 0.5

today:                             # the process the models are measured against
  markup: 1.8                      # price = markup * estimated cost
  rule_of_thumb:                   # what the quoting desk uses for assembly cost
    per_order: 50
    per_board: 2.5
    per_board_part: 0.03
    per_board_tht_part: 0.4
  standard_days: 5
  parts_missing_extra_days: 3
  explore_share: 0.2               # history: share of quotes priced off-list to learn response
  explore_price: [0.8, 1.25]
  explore_days: [-2, 2]

quote:
  promise_quantile: 0.9            # promise the date we meet 9 times out of 10
  list_ratios: [0.8, 0.85, 0.9, 0.95, 1.0, 1.05, 1.1, 1.15, 1.2, 1.25, 1.3, 1.35]   # price / today's list price
  min_margin: 0.15                 # never quote below cost * (1 + min_margin)
  trust_margin: 1.05              # never price beyond the explored range by more than this
  days_options: [3, 4, 5, 6, 7, 8, 10, 12, 15]
  explore_share: 0.1               # keep learning: a small share stays randomised
  explore_range: [0.8, 1.25]       # price / list price, the same range as the history
  replications: 8                 # twin runs per morning for the capacity outlook

schedule:
  horizon_days: 3
  solver_seconds: 2.0
  atcs_k1: 2.0

buy:
  service_level_floor: 0.5
  service_level_cap: 0.99
  delay_cost_per_order_day: 40     # what a day of parts delay costs (late credit + lost goodwill)
  stock_top_skus: 2500             # candidates for stocking (any part used recently); the rest per order
  review_days: 1

capacity:
  outlook_days: 6
  starve_utilisation: 0.7          # warn: the Grid will run out of work
  overload_utilisation: 1.0        # warn: more work than the Grid can do
